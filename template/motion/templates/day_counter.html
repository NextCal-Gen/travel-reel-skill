<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"day","type":"number","label":"Day number","default":3},
  {"id":"total","type":"number","label":"Total days (0 = no total, no bar)","default":14},
  {"id":"label","type":"string","label":"Place or theme under the number (empty = none)","default":"Hanoi"},
  {"id":"word","type":"string","label":"Word before the number","default":"DAY"},
  {"id":"position","type":"string","label":"top | upper | lower","default":"top"},
  {"id":"color","type":"color","label":"Text colour","default":"#FFF8EE"},
  {"id":"accent","type":"color","label":"Accent (bar, total)","default":"#F2C14E"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/common.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;-webkit-font-smoothing:antialiased}
#blk{position:absolute;left:70px;width:560px;text-shadow:0 3px 16px rgba(0,0,0,.42)}
#top{display:flex;align-items:flex-end;gap:16px;font-family:'Be Vietnam Pro',sans-serif;line-height:.9}
#word{font-weight:700;font-size:40px;letter-spacing:8px;padding-bottom:12px}
#numw{height:132px;overflow:hidden}
#num{font-weight:800;font-size:132px;letter-spacing:-3px;line-height:132px}
#num div{height:132px}
#tot{font-weight:700;font-size:48px;padding-bottom:12px}
#bar{position:relative;height:8px;width:420px;border-radius:4px;background:rgba(255,255,255,.28);margin-top:18px;overflow:hidden}
#fill{position:absolute;left:0;top:0;height:8px;width:0;border-radius:4px}
#lab{font-family:'Playfair Display','Be Vietnam Pro',serif;font-style:italic;font-weight:600;font-size:56px;margin-top:16px}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2.6" data-width="1080" data-height="1920">
  <div id="blk"><div id="top"><div id="word"></div><div id="numw"><div id="num"></div></div><div id="tot"></div></div>
  <div id="bar"><div id="fill"></div></div><div id="lab"></div></div>
</div>
<script>
(function () {
  var v = TR.vars();
  var day = Math.max(1, Math.round(TR.num(v.day, 1))), total = Math.round(TR.num(v.total, 0));
  var blk = document.getElementById('blk');
  TR.place(blk, v.position || 'top');
  blk.style.color = v.color || '#FFF8EE';
  var acc = v.accent || '#F2C14E';
  document.getElementById('word').textContent = v.word || 'DAY';
  /* number roll: the previous day slides up and the new one in */
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  document.getElementById('num').innerHTML = '<div>' + pad(Math.max(day - 1, 0)) + '</div><div>' + pad(day) + '</div>';
  var tot = document.getElementById('tot');
  if (total > 0) { tot.textContent = '/ ' + total; tot.style.color = acc; } else tot.style.display = 'none';
  document.getElementById('fill').style.background = acc;
  if (total <= 0) document.getElementById('bar').style.display = 'none';
  var lab = document.getElementById('lab');
  if (v.label) lab.textContent = v.label; else lab.style.display = 'none';

  gsap.set('#blk', { autoAlpha: 0, x: -30 });
  gsap.set('#num', { y: 0 });
  gsap.set('#lab', { autoAlpha: 0, y: 12 });
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  window.__timelines["main"] = tl;
  tl.to('#blk', { autoAlpha: 1, x: 0, duration: 0.45, ease: 'power3.out' }, 0.05);
  tl.to('#num', { y: -132, duration: 0.55, ease: 'expo.inOut' }, 0.35);
  if (total > 0) {
    tl.fromTo('#fill', { width: (420 * Math.max(day - 1, 0) / total) + 'px' },
              { width: (420 * Math.min(day / total, 1)) + 'px', duration: 0.7, ease: 'power3.inOut', immediateRender: false }, 0.40);
  }
  tl.to('#lab', { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.75);
  tl.to('#blk', { autoAlpha: 0, x: -20, duration: 0.35, ease: 'power2.in' }, 2.2);
  tl.set({}, {}, 2.6);
})();
</script>
</body>
</html>
