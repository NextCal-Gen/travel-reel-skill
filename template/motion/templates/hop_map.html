<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"outline","type":"string","label":"SVG path of the country in a 1000x1000 box (from 70_motion.py map)","default":"M420 60 L620 120 L700 400 L640 700 L520 940 L380 900 L330 600 L300 300 Z"},
  {"id":"stops","type":"string","label":"JSON list of {label, x, y, sub?} in the same 1000x1000 box, in route order","default":"[{\"label\":\"Hanoi\",\"x\":470,\"y\":180},{\"label\":\"Hue\",\"x\":600,\"y\":520},{\"label\":\"Hoi An\",\"x\":620,\"y\":610,\"sub\":\"days 6-8\"},{\"label\":\"Saigon\",\"x\":470,\"y\":880}]"},
  {"id":"title","type":"string","label":"Title above the map (empty = none)","default":"VIETNAM · 14 DAYS"},
  {"id":"color","type":"color","label":"Text and outline colour","default":"#FFF8EE"},
  {"id":"accent","type":"color","label":"Route and pin colour","default":"#F2C14E"},
  {"id":"land","type":"string","label":"Land fill (CSS colour, low alpha)","default":"rgba(255,248,238,0.16)"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/common.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;-webkit-font-smoothing:antialiased}
#ttl{position:absolute;left:70px;width:940px;top:250px;text-align:center;font-family:'Be Vietnam Pro',sans-serif;font-weight:700;
  font-size:38px;letter-spacing:9px;text-shadow:0 3px 14px rgba(0,0,0,.4)}
#map{position:absolute;left:150px;top:360px;width:780px;height:1000px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.lab{position:absolute;white-space:nowrap;font-family:'Be Vietnam Pro',sans-serif;font-weight:700;font-size:42px;line-height:1.05;
  text-shadow:0 3px 12px rgba(0,0,0,.5)}
.lab small{display:block;font-weight:600;font-size:28px;opacity:.85;margin-top:4px}
.L{text-align:right}.R{text-align:left}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5.5" data-width="1080" data-height="1920">
  <div id="ttl"></div>
  <svg id="map" viewBox="110 0 780 1000" fill="none" stroke-linecap="round" stroke-linejoin="round"></svg>
  <div id="labs"></div>
</div>
<script>
(function () {
  var v = TR.vars();
  var col = v.color || '#FFF8EE', acc = v.accent || '#F2C14E';
  var stops = TR.json(v.stops, []);
  /* the 1000x1000 map box is shown at 1:1 in a 780x1000 window (x 110-890 of the box), placed at x 150, y 360:
     page px = (box x - 110) + 150, page y = box y + 360. 70_motion.py centres maps in that window. */
  var X = function (bx) { return bx - 110 + 150; }, Y = function (by) { return by + 360; };
  var ttl = document.getElementById('ttl');
  if (v.title) { ttl.textContent = v.title; ttl.style.color = col; } else ttl.style.display = 'none';
  var route = '';
  for (var i = 0; i < stops.length; i++) route += (i ? ' L' : 'M') + stops[i].x + ' ' + stops[i].y;
  var svg = '<path id="land" d="' + (v.outline || '') + '" fill="' + (v.land || 'rgba(255,248,238,0.16)') + '" stroke="' + col + '" stroke-width="3.5"/>';
  for (var s = 1; s < stops.length; s++) {
    svg += '<path id="seg' + s + '" d="M' + stops[s - 1].x + ' ' + stops[s - 1].y + ' L' + stops[s].x + ' ' + stops[s].y + '" stroke="' + acc + '" stroke-width="7"/>';
  }
  for (var p = 0; p < stops.length; p++) {
    svg += '<circle id="ring' + p + '" cx="' + stops[p].x + '" cy="' + stops[p].y + '" r="16" stroke="' + acc + '" stroke-width="4"/>' +
           '<circle id="pin' + p + '" cx="' + stops[p].x + '" cy="' + stops[p].y + '" r="14" fill="' + acc + '" stroke="' + col + '" stroke-width="4"/>';
  }
  document.getElementById('map').innerHTML = svg;
  /* labels: estimated box from text length (no measuring), side chosen away from the neighbouring stops,
     then the first side that doesn't collide with placed labels or pins; else nudged vertically */
  var placed = [], html = '';
  var pinBoxes = stops.map(function (st) { return { x: X(st.x) - 22, y: Y(st.y) - 22, w: 44, h: 44 }; });
  var hit = function (r) {
    var all = placed.concat(pinBoxes);
    for (var i = 0; i < all.length; i++) {
      var o = all[i];
      if (r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y) return true;
    }
    return false;
  };
  for (var q = 0; q < stops.length; q++) {
    var st = stops[q], text = String(st.label || '');
    var w = Math.min(360, Math.max(80, text.length * 25 + 10)), h = st.sub ? 86 : 50;
    var nb = [], dxs = 0;
    if (q > 0) nb.push(stops[q - 1]); if (q < stops.length - 1) nb.push(stops[q + 1]);
    nb.forEach(function (n) { dxs += n.x - st.x; });
    var first = nb.length ? (dxs > 0 ? 'L' : 'R') : (st.x < 500 ? 'R' : 'L');
    var sides = first === 'R' ? ['R', 'L'] : ['L', 'R'], chosen = null;
    var box = function (side, dy) {
      var lx = side === 'R' ? X(st.x) + 30 : X(st.x) - 30 - w;
      var c = TR.clampBox(lx, Y(st.y) - 25 + dy, w, h);
      return { x: c.x, y: c.y, w: w, h: h, side: side };
    };
    var tries = [0, 40, -40, 80, -80, 120, -120];
    for (var t = 0; t < tries.length && !chosen; t++) {
      for (var k = 0; k < 2 && !chosen; k++) { var r = box(sides[k], tries[t]); if (!hit(r)) chosen = r; }
    }
    if (!chosen) chosen = box(sides[0], 0);
    placed.push(chosen);
    html += '<div class="lab ' + chosen.side + '" id="lab' + q + '" style="left:' + chosen.x + 'px;top:' + chosen.y + 'px;width:' + w + 'px;color:' + col + '">' +
            TR.esc(text) + (st.sub ? '<small>' + TR.esc(st.sub) + '</small>' : '') + '</div>';
  }
  document.getElementById('labs').innerHTML = html;

  var land = document.getElementById('land'), ll = land.getTotalLength();
  gsap.set(land, { attr: { 'stroke-dasharray': ll, 'stroke-dashoffset': ll }, fillOpacity: 0 });
  gsap.set('#ttl', { autoAlpha: 0, y: 14 });
  gsap.set('.lab', { autoAlpha: 0, y: 10 });
  for (var a = 0; a < stops.length; a++) {
    gsap.set('#pin' + a, { scale: 0, transformOrigin: '50% 50%' });
    gsap.set('#ring' + a, { scale: 1, autoAlpha: 0, transformOrigin: '50% 50%' });
  }
  var lens = [];
  for (var b = 1; b < stops.length; b++) {
    var sg = document.getElementById('seg' + b), sl = sg.getTotalLength();
    lens.push(sl); gsap.set(sg, { attr: { 'stroke-dasharray': sl, 'stroke-dashoffset': sl } });
  }
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  window.__timelines["main"] = tl;
  tl.to('#ttl', { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.05);
  tl.to(land, { attr: { 'stroke-dashoffset': 0 }, duration: 1.0, ease: 'power2.inOut' }, 0.10);
  tl.to(land, { fillOpacity: 1, duration: 0.5, ease: 'power1.out' }, 0.75);
  /* route: segments share 1.2 s .. 4.4 s in proportion to their length; a pin pops as the line reaches it */
  var tot = lens.reduce(function (m, n) { return m + n; }, 0) || 1, t = 1.2, span = 3.2;
  var pop = function (k, at) {
    tl.to('#pin' + k, { scale: 1, duration: 0.3, ease: 'back.out(2.5)' }, at);
    tl.fromTo('#ring' + k, { scale: 1, autoAlpha: 0.9 }, { scale: 2.6, autoAlpha: 0, duration: 0.6, ease: 'power2.out', immediateRender: false }, at);
    tl.to('#lab' + k, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power3.out' }, at + 0.05);
  };
  if (stops.length) pop(0, 1.05);
  for (var e = 1; e < stops.length; e++) {
    var d = Math.max(0.35, span * lens[e - 1] / tot);
    tl.to('#seg' + e, { attr: { 'stroke-dashoffset': 0 }, duration: d, ease: 'power1.inOut' }, t);
    t += d; pop(e, t - 0.05);
  }
  tl.to(['#map', '#labs', '#ttl'], { autoAlpha: 0, duration: 0.4, ease: 'power2.in' }, 5.1);
  tl.set({}, {}, 5.5);
})();
</script>
</body>
</html>
