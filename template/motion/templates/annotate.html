<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"shape","type":"string","label":"circle | arrow | underline","default":"circle"},
  {"id":"x","type":"number","label":"Target centre x (px, 1080 wide)","default":620},
  {"id":"y","type":"number","label":"Target centre y (px, 1920 tall)","default":900},
  {"id":"w","type":"number","label":"Target width (px)","default":300},
  {"id":"h","type":"number","label":"Target height (px)","default":190},
  {"id":"label","type":"string","label":"Handwritten label","default":"best seat in the house"},
  {"id":"label_side","type":"string","label":"above | below | left | right","default":"above"},
  {"id":"color","type":"color","label":"Ink colour","default":"#FFFFFF"},
  {"id":"stroke","type":"number","label":"Line width (px)","default":9}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/common.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;-webkit-font-smoothing:antialiased}
#ink{position:absolute;left:0;top:0;width:1080px;height:1920px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
#lab{position:absolute;width:560px;font-family:'Patrick Hand','Be Vietnam Pro',cursive;font-size:64px;line-height:1.02;
  text-shadow:0 3px 12px rgba(0,0,0,.45);text-wrap:balance}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <svg id="ink" viewBox="0 0 1080 1920" fill="none" stroke-linecap="round" stroke-linejoin="round"></svg>
  <div id="lab"></div>
</div>
<script>
(function () {
  var v = TR.vars(), S = TR.SAFE;
  var x = TR.num(v.x, 620), y = TR.num(v.y, 900), w = TR.num(v.w, 300), h = TR.num(v.h, 190);
  var col = v.color || '#FFFFFF', sw = TR.num(v.stroke, 9), shape = v.shape || 'circle';
  var rx = w / 2, ry = h / 2, d = '', head = '';
  var side = v.label_side || 'above', LW = 560, LH = 150, lx, ly;
  if (shape === 'circle') {
    /* hand-drawn loop: a smooth, slightly tilted ellipse that overshoots its start */
    var pts = [], N = 120;
    for (var i = 0; i <= N; i++) {
      var a = -2.3 + (i / N) * (Math.PI * 2 + 0.6);
      var wob = 1 + 0.025 * Math.sin(2 * a + 0.8) + 0.06 * Math.max(0, (i - N * 0.88) / (N * 0.12));
      var px = Math.cos(a) * rx * wob, py = Math.sin(a) * ry * wob;
      pts.push([x + px * 0.995 - py * 0.06, y + py + px * 0.04]);
    }
    d = 'M' + pts.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L');
  } else if (shape === 'underline') {
    var yy = y + ry;
    d = 'M' + (x - rx) + ' ' + (yy + 4) + ' C ' + (x - rx / 3) + ' ' + (yy - 10) + ', ' + (x + rx / 3) + ' ' + (yy + 12) + ', ' + (x + rx) + ' ' + (yy - 6);
  } else {
    /* arrow: starts 260 px from the target on the label side, curves in, ends at the target's edge */
    var dx = side === 'left' ? -1 : side === 'right' ? 1 : -0.35, dy = side === 'above' ? -1 : side === 'below' ? 1 : -0.55;
    var n = Math.sqrt(dx * dx + dy * dy); dx /= n; dy /= n;
    var ex = x + dx * rx * 0.8, ey = y + dy * ry * 0.8;
    var sx = ex + dx * 260, sy = ey + dy * 260;
    var cx = (sx + ex) / 2 - dy * 70, cy = (sy + ey) / 2 + dx * 70;
    d = 'M' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ' Q ' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + ex.toFixed(1) + ' ' + ey.toFixed(1);
    var ang = Math.atan2(ey - cy, ex - cx), L = 42;
    head = 'M' + (ex - L * Math.cos(ang - 0.5)).toFixed(1) + ' ' + (ey - L * Math.sin(ang - 0.5)).toFixed(1) + ' L' + ex.toFixed(1) + ' ' + ey.toFixed(1) +
           ' L' + (ex - L * Math.cos(ang + 0.5)).toFixed(1) + ' ' + (ey - L * Math.sin(ang + 0.5)).toFixed(1);
    lx = sx - LW / 2; ly = dy > 0 ? sy + 20 : sy - 20 - LH;          /* label sits at the arrow's tail */
  }
  if (lx === undefined) {
    lx = x - LW / 2; ly = side === 'below' ? y + ry + 40 : y - ry - 40 - LH;
    if (side === 'left') { lx = x - rx - 40 - LW; ly = y - LH / 2; }
    if (side === 'right') { lx = x + rx + 40; ly = y - LH / 2; }
  }
  var svg = document.getElementById('ink');
  svg.innerHTML = '<path id="p1" d="' + d + '" stroke="' + col + '" stroke-width="' + sw + '"/>' +
                  (head ? '<path id="p2" d="' + head + '" stroke="' + col + '" stroke-width="' + sw + '"/>' : '');
  /* label box: fixed 560 x 150 (no measuring), clamped into the safe zone */
  var lab = document.getElementById('lab');
  lab.textContent = v.label || '';
  lab.style.color = col;
  var c = TR.clampBox(lx, ly, LW, LH);
  lab.style.left = c.x + 'px'; lab.style.top = c.y + 'px';
  var arrowTail = shape === 'arrow';
  lab.style.textAlign = arrowTail ? 'center' : side === 'left' ? 'right' : side === 'right' ? 'left' : 'center';
  lab.style.display = 'flex'; lab.style.height = LH + 'px';
  lab.style.alignItems = (arrowTail ? (ly > y ? 'flex-start' : 'flex-end') : side === 'below' ? 'flex-start' : side === 'above' ? 'flex-end' : 'center');
  lab.style.justifyContent = arrowTail ? 'center' : side === 'left' ? 'flex-end' : side === 'right' ? 'flex-start' : 'center';

  var p1 = document.getElementById('p1'), len1 = p1.getTotalLength();
  gsap.set(p1, { attr: { 'stroke-dasharray': len1, 'stroke-dashoffset': len1 } });
  var p2 = document.getElementById('p2'), len2 = p2 ? p2.getTotalLength() : 0;
  if (p2) gsap.set(p2, { attr: { 'stroke-dasharray': len2, 'stroke-dashoffset': len2 } });
  gsap.set('#lab', { autoAlpha: 0, y: 10, rotation: -2 });
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  window.__timelines["main"] = tl;
  tl.to(p1, { attr: { 'stroke-dashoffset': 0 }, duration: 0.65, ease: 'power2.inOut' }, 0.10);
  if (p2) tl.to(p2, { attr: { 'stroke-dashoffset': 0 }, duration: 0.2, ease: 'power2.out' }, 0.72);
  tl.to('#lab', { autoAlpha: 1, y: 0, rotation: -2, duration: 0.35, ease: 'back.out(2)' }, 0.55);
  tl.to(['#ink', '#lab'], { autoAlpha: 0, duration: 0.35, ease: 'power2.in' }, 2.6);
  tl.set({}, {}, 3);
})();
</script>
</body>
</html>
